<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ukeord & Gloser</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header class="app-header">
        <p class="eyebrow">Lær og lek!</p>
        <h1>📚 Ukeord & Gloser 🚀</h1>
        <p class="subtitle">Velkommen til en morsom treningsside for ord og gloser!</p>
    </header>

    <div class="mode-selector">
        <button onclick="startGame('ukeord')" type="button">Ukeord 🎯</button>
        <button onclick="startGame('gloser')" type="button">Gloser 🌍</button>
    </div>

    <div class="custom-section" id="customWords">
        <h3>Legg til egne ord</h3>

        <div class="custom-grid">
            <div class="custom-column">
                <label for="customUkeordInput">
                    Ukeord – ett ord per linje
                </label>

                <textarea
                    id="customUkeordInput"
                    placeholder="sjokolade
 kjøkken
 familie"></textarea>
            </div>

            <div class="custom-column">
                <label for="customGloserInput">
                    Gloser – norsk - engelsk
                </label>

                <textarea
                    id="customGloserInput"
                    placeholder="hund - dog
 katt - cat
 hus - house"></textarea>
            </div>
        </div>

        <div class="custom-actions">
            <button id="saveCustomBtn" type="button">
                Lagre egne ord
            </button>
        </div>

        <p id="customStatus" class="custom-status" aria-live="polite"></p>
    </div>

    <div class="toggle-actions">
        <button
            id="toggleWordsBtn"
            type="button"
            class="toggle-button"
            aria-pressed="false"
            aria-label="Skjul egne ord">
            Skjul egne ord
        </button>
    </div>

    <div id="game" class="hidden">
        <div class="score">
            ⭐ Poeng: <span id="score">0</span>
        </div>

        <div class="progress">
            <span id="progress"></span>
        </div>

        <div class="question-box">
            <h2 id="question"></h2>
        </div>

        <input
            type="text"
            id="answer"
            placeholder="Skriv svaret her..."
            autocomplete="off">

        <button id="checkBtn" type="button">
            Svar
        </button>

        <div id="feedback"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
