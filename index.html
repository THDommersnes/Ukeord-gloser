<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Øv på Ukeord og Gloser</title>

    <link rel="stylesheet" href="
    style.css
</head>
<body>

<div class="container">

    <h1>📚 Ukeord & Gloser</h1>

    <div class="mode-selector">
        <button onclick="startGame('ukeord')">Ukeord</button>
        <button onclick="startGame('gloser')">Gloser</button>
    </div>

    <div id="game" class="hidden">

        <div class="score">
            ⭐ Poeng: <span id="score">0</span>
        </div>

        <div class="progress">
            <span id="progress"></span>
        </div>

        <div class="question-box">
            <h2 id="question"></h2>
        </div>

        <input
            type="text"
            id="answer"
            placeholder="Skriv svaret her..."
            autocomplete="off">

        <button id="checkBtn">Svar</button>

        <div id="feedback"></div>

    </div>

</div>

script.jsscript>

</body>
</html>
